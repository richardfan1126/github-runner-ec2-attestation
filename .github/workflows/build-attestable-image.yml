name: Build Attestable Image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      enable_ssh:
        description: 'Enable SSH debug access in the built image (NOT for production use)'
        type: boolean
        default: false
      force_flavor:
        description: 'Force rebuild of a specific flavor (or "all"). Leave empty for automatic change detection.'
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      image_matrix: ${{ steps.matrix.outputs.image_matrix }}
      ami_only_matrix: ${{ steps.matrix.outputs.ami_only_matrix }}
      ami_matrix: ${{ steps.matrix.outputs.ami_matrix }}
      has_image_builds: ${{ steps.matrix.outputs.has_image_builds }}
      has_ami_only_builds: ${{ steps.matrix.outputs.has_ami_only_builds }}
      has_ami_builds: ${{ steps.matrix.outputs.has_ami_builds }}
      reason: ${{ steps.matrix.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Compute build matrix
        id: matrix
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE_FLAVOR: ${{ inputs.force_flavor }}
        run: |
          ARGS=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$FORCE_FLAVOR" ]; then
            ARGS="--force-flavor $FORCE_FLAVOR"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # workflow_dispatch without force_flavor: no push baseline, rebuild all
            ARGS="--no-diff-baseline"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch or force push: no diff baseline
            ARGS="--no-diff-baseline"
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
            ARGS="--changed-files changed_files.txt"
          fi

          RESULT=$(uv run python .github/scripts/detect_changes.py \
            $ARGS \
            --summary-file detect_summary.md)

          echo "image_matrix=$(echo "$RESULT" | jq -c '.image_matrix')" >> $GITHUB_OUTPUT
          echo "ami_only_matrix=$(echo "$RESULT" | jq -c '.ami_only_matrix')" >> $GITHUB_OUTPUT
          echo "ami_matrix=$(echo "$RESULT" | jq -c '.ami_matrix')" >> $GITHUB_OUTPUT
          echo "has_image_builds=$(echo "$RESULT" | jq -r '.has_image_builds')" >> $GITHUB_OUTPUT
          echo "has_ami_only_builds=$(echo "$RESULT" | jq -r '.has_ami_only_builds')" >> $GITHUB_OUTPUT
          echo "has_ami_builds=$(echo "$RESULT" | jq -r '.has_ami_builds')" >> $GITHUB_OUTPUT
          echo "reason=$(echo "$RESULT" | jq -r '.reason')" >> $GITHUB_OUTPUT

      - name: Write rebuild decision to summary
        run: cat detect_summary.md >> "$GITHUB_STEP_SUMMARY"

  build-and-publish:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_image_builds == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.image_matrix) }}
      max-parallel: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build KIWI builder Docker image
        run: |
          docker build -t kiwi-builder:latest -f .github/docker/Dockerfile.kiwi-builder .

      - name: Validate committed env files
        run: |
          # Enumerate all committed env files dynamically (flavors/default/env + flavors/*/env).
          # New flavors are picked up automatically without editing this step.
          mapfile -t ENV_FILES < <(find flavors -name env -type f | sort)
          uv run python .github/scripts/validate_env.py "${ENV_FILES[@]}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push flavor container image
        id: build_flavor_image
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO_LOWER}/${{ matrix.flavor }}"

          docker buildx build \
            --platform linux/amd64 \
            --push \
            --metadata-file flavor-image-metadata.json \
            -t "${IMAGE_REF}:${{ github.sha }}" \
            flavors/${{ matrix.flavor }}

          # Extract the pushed manifest digest from buildx metadata.
          # Single-platform build (linux/amd64) produces a single manifest (not an index),
          # so containerimage.digest is the amd64 per-platform manifest digest (D11).
          DIGEST=$(jq -r '."containerimage.digest"' flavor-image-metadata.json)
          echo "container_image=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "container_image_digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "✓ Built and pushed ${IMAGE_REF}@${DIGEST}"

      - name: Merge flavor env files (inject bucket-③ digest)
        run: |
          uv run python .github/scripts/merge_env.py \
            --flavor ${{ matrix.flavor }} \
            --container-image ${{ steps.build_flavor_image.outputs.container_image }} \
            --container-image-digest ${{ steps.build_flavor_image.outputs.container_image_digest }} \
            --output effective-${{ matrix.flavor }}.env

      - name: Build KIWI image
        run: |
          chmod +x .github/scripts/build-kiwi-image.sh
          SSH_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            SSH_FLAG="--enable-ssh"
          fi
          .github/scripts/build-kiwi-image.sh $SSH_FLAG --env-file effective-${{ matrix.flavor }}.env

      - name: Print effective configuration to summary
        run: |
          echo "### Effective Server Configuration (${{ matrix.flavor }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          uv run python .github/scripts/print_config.py \
            --env-file effective-${{ matrix.flavor }}.env \
            --flavor ${{ matrix.flavor }} \
            >> "$GITHUB_STEP_SUMMARY"

      - name: SSH debug warning
        if: github.event_name == 'workflow_dispatch' && inputs.enable_ssh == true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **WARNING: This image was built with SSH debug access enabled.**" >> $GITHUB_STEP_SUMMARY
          echo "> This image is NOT intended for production use." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-build-output-${{ matrix.flavor }}
          path: |
            build-output/*.raw
            build-output/pcr_measurements.json
          retention-days: 30

      - name: Extract PCR measurements
        id: pcr
        run: |
          PCR4=$(jq -r '.Measurements.PCR4' build-output/pcr_measurements.json)
          PCR7=$(jq -r '.Measurements.PCR7' build-output/pcr_measurements.json)

          if [ -z "$PCR4" ] || [ "$PCR4" = "null" ]; then
            echo "::error::PCR4 measurement is missing or invalid"
            exit 1
          fi

          if [ -z "$PCR7" ] || [ "$PCR7" = "null" ]; then
            echo "::error::PCR7 measurement is missing or invalid"
            exit 1
          fi

          echo "pcr4=$PCR4" >> $GITHUB_OUTPUT
          echo "pcr7=$PCR7" >> $GITHUB_OUTPUT

          echo "### PCR Measurements (${{ matrix.flavor }})" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`$PCR4\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`$PCR7\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate artifact tag
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="${BRANCH_NAME}-${TIMESTAMP}-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Artifact tag: $TAG"

      - name: Install ORAS
        run: |
          VERSION="1.3.0"
          # Expected SHA-256 checksum for oras_1.3.0_linux_amd64.tar.gz
          # Source: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_checksums.txt
          EXPECTED_SHA256="6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          # Verify SHA-256 checksum before extracting (Requirements: 17.13, 17.14)
          echo "${EXPECTED_SHA256}  oras_${VERSION}_linux_amd64.tar.gz" | sha256sum -c || {
            echo "::error::ORAS archive checksum verification failed. Expected ${EXPECTED_SHA256}."
            exit 1
          }
          mkdir -p oras-install/
          tar -zxf oras_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_*.tar.gz oras-install/
          oras version

      - name: Authenticate to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push artifact to GHCR
        id: push
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ARTIFACT_REF="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}:${{ steps.tag.outputs.tag }}"

          RAW_IMAGE=$(find build-output -name "*.raw" -type f | head -n 1)
          if [ -z "$RAW_IMAGE" ]; then
            echo "::error::Raw disk image not found in build-output directory"
            exit 1
          fi

          # Determine debug annotation based on whether SSH was enabled
          DEBUG_VALUE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            DEBUG_VALUE="true"
          fi

          echo "Pushing artifact to: $ARTIFACT_REF"

          if ! oras push "$ARTIFACT_REF" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "com.github.attestable-image.pcr4=${{ steps.pcr.outputs.pcr4 }}" \
            --annotation "com.github.attestable-image.pcr7=${{ steps.pcr.outputs.pcr7 }}" \
            --annotation "com.github.attestable-image.container-image-digest=${{ steps.build_flavor_image.outputs.container_image_digest }}" \
            --annotation "com.github.attestable-image.flavor=${{ matrix.flavor }}" \
            --annotation "debug=${DEBUG_VALUE}" \
            "$RAW_IMAGE:application/octet-stream" \
            build-output/pcr_measurements.json:application/json; then
            echo "::error::Failed to push artifact to GHCR"
            exit 1
          fi

          # Get the digest
          DIGEST=$(oras manifest fetch "$ARTIFACT_REF" --descriptor | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "artifact_ref=$ARTIFACT_REF" >> $GITHUB_OUTPUT

          # Output the full digest-pinned reference for downstream consumers
          # This immutable reference prevents TOCTOU attacks via tag movement
          SUBJECT_NAME="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}"
          ARTIFACT_REF_DIGEST="${SUBJECT_NAME}@${DIGEST}"
          echo "artifact_ref_digest=$ARTIFACT_REF_DIGEST" >> $GITHUB_OUTPUT
          echo "subject_name=$SUBJECT_NAME" >> $GITHUB_OUTPUT

          echo "### Artifact Published (${{ matrix.flavor }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`$ARTIFACT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`$ARTIFACT_REF_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Save build context for AMI job
        run: |
          jq -n \
            --arg artifact_ref "${{ steps.push.outputs.artifact_ref_digest }}" \
            --arg container_image_digest "${{ steps.build_flavor_image.outputs.container_image_digest }}" \
            '{"artifact_ref": $artifact_ref, "container_image_digest": $container_image_digest}' \
            > build-context.json

      - name: Upload build context for AMI job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-context-${{ matrix.flavor }}
          path: build-context.json
          retention-days: 1

      - name: Generate workflow summary
        run: |
          echo "## Build Complete (${{ matrix.flavor }}) ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`${{ steps.push.outputs.artifact_ref_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`${{ steps.push.outputs.artifact_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PCR Measurements" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`${{ steps.pcr.outputs.pcr4 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`${{ steps.pcr.outputs.pcr7 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Attestation" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation ID**: \`${{ steps.attest.outputs.attestation-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation URL**: ${{ steps.attest.outputs.attestation-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To verify the attestation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ steps.push.outputs.artifact_ref_digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --owner ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pull the artifact:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "oras pull ${{ steps.push.outputs.artifact_ref_digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-kiwi-ami-only:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_ami_only_builds == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.ami_only_matrix) }}
      max-parallel: 2

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build KIWI builder Docker image
        run: |
          docker build -t kiwi-builder:latest -f .github/docker/Dockerfile.kiwi-builder .

      - name: Read flavor image digest from flavors.lock
        id: lock
        run: |
          if [ ! -f flavors.lock ]; then
            echo "::error::flavors.lock not found. Run a full image-level build for '${{ matrix.flavor }}' first (task 6.2 populates it)."
            exit 1
          fi
          DIGEST=$(jq -r --arg f "${{ matrix.flavor }}" '.[$f].container_image_digest // empty' flavors.lock)
          if [ -z "$DIGEST" ]; then
            echo "::error::No entry for flavor '${{ matrix.flavor }}' in flavors.lock. Run a full image-level build first."
            exit 1
          fi
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO_LOWER}/${{ matrix.flavor }}"
          echo "container_image=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "container_image_digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "✓ Reusing existing digest for '${{ matrix.flavor }}': ${DIGEST}"

      - name: Merge flavor env files (inject existing bucket-③ digest)
        run: |
          uv run python .github/scripts/merge_env.py \
            --flavor ${{ matrix.flavor }} \
            --container-image ${{ steps.lock.outputs.container_image }} \
            --container-image-digest ${{ steps.lock.outputs.container_image_digest }} \
            --output effective-${{ matrix.flavor }}.env

      - name: Build KIWI image
        run: |
          chmod +x .github/scripts/build-kiwi-image.sh
          SSH_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            SSH_FLAG="--enable-ssh"
          fi
          .github/scripts/build-kiwi-image.sh $SSH_FLAG --env-file effective-${{ matrix.flavor }}.env

      - name: Print effective configuration to summary
        run: |
          echo "### Effective Server Configuration (${{ matrix.flavor }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          uv run python .github/scripts/print_config.py \
            --env-file effective-${{ matrix.flavor }}.env \
            --flavor ${{ matrix.flavor }} \
            >> "$GITHUB_STEP_SUMMARY"

      - name: SSH debug warning
        if: github.event_name == 'workflow_dispatch' && inputs.enable_ssh == true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **WARNING: This image was built with SSH debug access enabled.**" >> $GITHUB_STEP_SUMMARY
          echo "> This image is NOT intended for production use." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-build-output-${{ matrix.flavor }}
          path: |
            build-output/*.raw
            build-output/pcr_measurements.json
          retention-days: 30

      - name: Extract PCR measurements
        id: pcr
        run: |
          PCR4=$(jq -r '.Measurements.PCR4' build-output/pcr_measurements.json)
          PCR7=$(jq -r '.Measurements.PCR7' build-output/pcr_measurements.json)

          if [ -z "$PCR4" ] || [ "$PCR4" = "null" ]; then
            echo "::error::PCR4 measurement is missing or invalid"
            exit 1
          fi

          if [ -z "$PCR7" ] || [ "$PCR7" = "null" ]; then
            echo "::error::PCR7 measurement is missing or invalid"
            exit 1
          fi

          echo "pcr4=$PCR4" >> $GITHUB_OUTPUT
          echo "pcr7=$PCR7" >> $GITHUB_OUTPUT

          echo "### PCR Measurements (${{ matrix.flavor }})" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`$PCR4\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`$PCR7\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate artifact tag
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="${BRANCH_NAME}-${TIMESTAMP}-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Artifact tag: $TAG"

      - name: Install ORAS
        run: |
          VERSION="1.3.0"
          EXPECTED_SHA256="6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          echo "${EXPECTED_SHA256}  oras_${VERSION}_linux_amd64.tar.gz" | sha256sum -c || {
            echo "::error::ORAS archive checksum verification failed. Expected ${EXPECTED_SHA256}."
            exit 1
          }
          mkdir -p oras-install/
          tar -zxf oras_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_*.tar.gz oras-install/
          oras version

      - name: Authenticate to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push artifact to GHCR
        id: push
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ARTIFACT_REF="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}:${{ steps.tag.outputs.tag }}"

          RAW_IMAGE=$(find build-output -name "*.raw" -type f | head -n 1)
          if [ -z "$RAW_IMAGE" ]; then
            echo "::error::Raw disk image not found in build-output directory"
            exit 1
          fi

          DEBUG_VALUE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            DEBUG_VALUE="true"
          fi

          echo "Pushing artifact to: $ARTIFACT_REF"

          if ! oras push "$ARTIFACT_REF" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "com.github.attestable-image.pcr4=${{ steps.pcr.outputs.pcr4 }}" \
            --annotation "com.github.attestable-image.pcr7=${{ steps.pcr.outputs.pcr7 }}" \
            --annotation "com.github.attestable-image.container-image-digest=${{ steps.lock.outputs.container_image_digest }}" \
            --annotation "com.github.attestable-image.flavor=${{ matrix.flavor }}" \
            --annotation "debug=${DEBUG_VALUE}" \
            "$RAW_IMAGE:application/octet-stream" \
            build-output/pcr_measurements.json:application/json; then
            echo "::error::Failed to push artifact to GHCR"
            exit 1
          fi

          DIGEST=$(oras manifest fetch "$ARTIFACT_REF" --descriptor | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "artifact_ref=$ARTIFACT_REF" >> $GITHUB_OUTPUT

          SUBJECT_NAME="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}"
          ARTIFACT_REF_DIGEST="${SUBJECT_NAME}@${DIGEST}"
          echo "artifact_ref_digest=$ARTIFACT_REF_DIGEST" >> $GITHUB_OUTPUT
          echo "subject_name=$SUBJECT_NAME" >> $GITHUB_OUTPUT

          echo "### Artifact Published (${{ matrix.flavor }} — AMI-only rebuild)" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`$ARTIFACT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`$ARTIFACT_REF_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Save build context for AMI job
        run: |
          jq -n \
            --arg artifact_ref "${{ steps.push.outputs.artifact_ref_digest }}" \
            --arg container_image_digest "${{ steps.lock.outputs.container_image_digest }}" \
            '{"artifact_ref": $artifact_ref, "container_image_digest": $container_image_digest}' \
            > build-context.json

      - name: Upload build context for AMI job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-context-${{ matrix.flavor }}
          path: build-context.json
          retention-days: 1

      - name: Generate workflow summary
        run: |
          echo "## Build Complete (${{ matrix.flavor }} — AMI-only rebuild) ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`${{ steps.push.outputs.artifact_ref_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`${{ steps.push.outputs.artifact_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PCR Measurements" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`${{ steps.pcr.outputs.pcr4 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`${{ steps.pcr.outputs.pcr7 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Attestation" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation ID**: \`${{ steps.attest.outputs.attestation-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation URL**: ${{ steps.attest.outputs.attestation-url }}" >> $GITHUB_STEP_SUMMARY

  build-ami:
    needs: [detect-changes, build-and-publish, build-kiwi-ami-only]
    # Run when detect-changes succeeded and both upstream matrix jobs ended cleanly (success or skipped).
    # develop-skip: AMIs are only registered on main or workflow_dispatch (task 5.2).
    if: |
      always() &&
      needs.detect-changes.result == 'success' &&
      (needs.build-and-publish.result == 'success' || needs.build-and-publish.result == 'skipped') &&
      (needs.build-kiwi-ami-only.result == 'success' || needs.build-kiwi-ami-only.result == 'skipped') &&
      needs.detect-changes.outputs.has_ami_builds == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.ami_matrix) }}
      max-parallel: 2

    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.12.2"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Download build context for ${{ matrix.flavor }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-context-${{ matrix.flavor }}
          path: .

      - name: Read build context
        id: ctx
        run: |
          ARTIFACT_REF=$(jq -r '.artifact_ref' build-context.json)
          CONTAINER_IMAGE_DIGEST=$(jq -r '.container_image_digest' build-context.json)
          echo "artifact_ref=${ARTIFACT_REF}" >> $GITHUB_OUTPUT
          echo "container_image_digest=${CONTAINER_IMAGE_DIGEST}" >> $GITHUB_OUTPUT

      - name: Build AMI (${{ matrix.flavor }})
        run: |
          ALLOW_DEBUG_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            ALLOW_DEBUG_FLAG="--allow-debug"
          fi
          uv run python scripts/build-ami.py \
            --artifact-ref "${{ steps.ctx.outputs.artifact_ref }}" \
            --region "${{ vars.AWS_REGION || 'us-east-1' }}" \
            --output-file ami_build_result.json \
            --expected-workflow .github/workflows/build-attestable-image.yml \
            --container-image-digest "${{ steps.ctx.outputs.container_image_digest }}" \
            --producing-commit "${{ github.sha }}" \
            $ALLOW_DEBUG_FLAG

      - name: Upload AMI build result
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ami-build-result-${{ matrix.flavor }}
          path: ami_build_result.json
          retention-days: 90

      - name: Write success summary
        if: success()
        run: |
          AMI_ID=$(jq -r '.ami_id' ami_build_result.json)
          SNAPSHOT_ID=$(jq -r '.snapshot_id' ami_build_result.json)
          REGION=$(jq -r '.region' ami_build_result.json)
          BUILD_TIMESTAMP=$(jq -r '.build_timestamp' ami_build_result.json)
          echo "## AMI Build Complete (${{ matrix.flavor }}) ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### AMI Details" >> $GITHUB_STEP_SUMMARY
          echo "- **AMI ID**: \`${AMI_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Snapshot ID**: \`${SNAPSHOT_ID}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: \`${REGION}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Timestamp**: \`${BUILD_TIMESTAMP}\`" >> $GITHUB_STEP_SUMMARY

          CID=$(jq -r '.verifier_record.container_image_digest // "unknown"' ami_build_result.json)
          PCR4=$(jq -r '.verifier_record.pcr4 // .pcr_measurements.pcr4' ami_build_result.json)
          COMMIT=$(jq -r '.verifier_record.producing_commit // "unknown"' ami_build_result.json)
          {
            echo ""
            echo "### Verifier Record (${{ matrix.flavor }})"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Container image digest | \`${CID}\` |"
            echo "| PCR4 | \`${PCR4}\` |"
            echo "| AMI ID | \`${AMI_ID}\` |"
            echo "| Producing commit | \`${COMMIT}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verifier record: container_image_digest=${CID} pcr4=${PCR4} ami_id=${AMI_ID} producing_commit=${COMMIT}"

      - name: Write debug warning
        if: success() && github.event_name == 'workflow_dispatch' && inputs.enable_ssh == true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **WARNING: This AMI was built from a debug artifact (enable_ssh: true).**" >> $GITHUB_STEP_SUMMARY
          echo "> This AMI is NOT intended for production use." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Write failure summary
        if: failure()
        run: |
          echo "## AMI Build Failed (${{ matrix.flavor }}) ❌" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The AMI build step failed. Check the job logs for details." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup Terraform resources
        if: always()
        run: |
          cd terraform/build-ami
          terraform init -input=false
          terraform destroy -auto-approve \
            -var "region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -var "instance_type=c5.9xlarge" \
            -var "allowed_ssh_cidr=0.0.0.0/0" \
          || echo "::warning::Terraform destroy encountered errors. Manual cleanup may be required."

  update-flavors-lock:
    needs: [detect-changes, build-ami]
    # Skip debug builds (enable_ssh=true) — those AMIs must not enter flavors.lock (task 6.4).
    # Cascading skip from build-ami handles develop-skip and empty-matrix cases automatically.
    if: "!(github.event_name == 'workflow_dispatch' && inputs.enable_ssh == true)"
    runs-on: ubuntu-24.04
    # Serialize flavors.lock write-backs: only one update runs at a time per ref;
    # queued runs proceed in order rather than being cancelled (task 6.3).
    concurrency:
      group: flavors-lock-update-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}

      - name: Download all AMI build results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ami-build-result-*
          path: ami-results/

      - name: Update flavors.lock
        env:
          AMI_MATRIX: ${{ needs.detect-changes.outputs.ami_matrix }}
        run: |
          # Start from the existing lock (carry forward unchanged entries) or an empty object.
          LOCK='{}'
          if [ -f flavors.lock ]; then
            LOCK=$(cat flavors.lock)
          fi

          # For each flavor rebuilt in this run, merge in the new verifier record.
          # ami-results/ami-build-result-<flavor>/ami_build_result.json is the per-flavor output.
          FLAVORS=$(echo "$AMI_MATRIX" | jq -r '.include[].flavor')
          for FLAVOR in $FLAVORS; do
            RESULT_FILE="ami-results/ami-build-result-${FLAVOR}/ami_build_result.json"
            if [ -f "$RESULT_FILE" ]; then
              ENTRY=$(jq '{
                container_image_digest: .verifier_record.container_image_digest,
                pcr4: .verifier_record.pcr4,
                ami_id: .verifier_record.ami_id,
                producing_commit: .verifier_record.producing_commit
              }' "$RESULT_FILE")
              LOCK=$(echo "$LOCK" | jq --arg f "$FLAVOR" --argjson e "$ENTRY" '.[$f] = $e')
            else
              echo "::warning::No build result for flavor '${FLAVOR}' — entry not updated"
            fi
          done

          # Write sorted, pretty-printed JSON for stable diffs.
          printf '%s\n' "$LOCK" | jq --sort-keys '.' > flavors.lock
          echo "flavors.lock after update:"
          cat flavors.lock

      - name: Commit and push flavors.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet flavors.lock; then
            echo "No changes to flavors.lock — skipping commit"
            exit 0
          fi

          git add flavors.lock
          git commit -m "chore: update flavors.lock after AMI build [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Write flavors.lock summary
        run: |
          echo "## flavors.lock Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          cat flavors.lock >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
