name: Build Attestable Image

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      enable_ssh:
        description: 'Enable SSH debug access in the built image (NOT for production use)'
        type: boolean
        default: false
      force_flavor:
        description: 'Force rebuild of a specific flavor (or "all"). Leave empty for automatic change detection.'
        type: string
        default: ''

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      ami_matrix: ${{ steps.matrix.outputs.ami_matrix }}
      has_builds: ${{ steps.matrix.outputs.has_builds }}
      has_ami_builds: ${{ steps.matrix.outputs.has_ami_builds }}
      reason: ${{ steps.matrix.outputs.reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 2

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Compute build matrix
        id: matrix
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          FORCE_FLAVOR: ${{ inputs.force_flavor }}
        run: |
          ARGS=""
          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$FORCE_FLAVOR" ]; then
            ARGS="--force-flavor $FORCE_FLAVOR"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # workflow_dispatch without force_flavor: no push baseline, rebuild all
            ARGS="--no-diff-baseline"
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch or force push: no diff baseline
            ARGS="--no-diff-baseline"
          elif ! git cat-file -e "$BEFORE" 2>/dev/null; then
            # BEFORE commit not in shallow clone (e.g. multi-commit push with fetch-depth: 2)
            ARGS="--no-diff-baseline"
          else
            git diff --name-only "$BEFORE" "$AFTER" > changed_files.txt
            ARGS="--changed-files changed_files.txt"
          fi

          RESULT=$(uv run python .github/scripts/detect_changes.py \
            $ARGS \
            --summary-file detect_summary.md)

          echo "build_matrix=$(echo "$RESULT" | jq -c '.build_matrix')" >> $GITHUB_OUTPUT
          echo "ami_matrix=$(echo "$RESULT" | jq -c '.ami_matrix')" >> $GITHUB_OUTPUT
          echo "has_builds=$(echo "$RESULT" | jq -r '.has_builds')" >> $GITHUB_OUTPUT
          echo "has_ami_builds=$(echo "$RESULT" | jq -r '.has_ami_builds')" >> $GITHUB_OUTPUT
          echo "reason=$(echo "$RESULT" | jq -r '.reason')" >> $GITHUB_OUTPUT

      - name: Write rebuild decision to summary
        run: cat detect_summary.md >> "$GITHUB_STEP_SUMMARY"

  build-flavor-image:
    needs: [detect-changes]
    if: needs.detect-changes.outputs.has_builds == 'true'
    runs-on: ubuntu-24.04
    strategy:
      matrix: ${{ fromJSON(needs.detect-changes.outputs.build_matrix) }}
      max-parallel: 2
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Build KIWI builder Docker image
        run: |
          docker build -t kiwi-builder:latest -f .github/docker/Dockerfile.kiwi-builder .

      - name: Validate committed env files
        run: |
          # Enumerate all committed env files dynamically (flavors/default/env + flavors/*/env).
          # New flavors are picked up automatically without editing this step.
          mapfile -t ENV_FILES < <(find flavors -name env -type f | sort)
          uv run python .github/scripts/validate_env.py "${ENV_FILES[@]}"

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Resolve container image digest
        id: digest
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REF="ghcr.io/${REPO_LOWER}/${{ matrix.flavor }}"

          if [ "${{ matrix.mode }}" = "image" ]; then
            # Image-level rebuild: build + push the flavor container and derive a fresh
            # per-platform linux/amd64 manifest digest (D11 / D2 constraint 1).
            docker buildx build \
              --platform linux/amd64 \
              --push \
              --metadata-file flavor-image-metadata.json \
              -t "${IMAGE_REF}:${{ github.sha }}" \
              flavors/${{ matrix.flavor }}

            # docker buildx with provenance enabled (the default in GitHub Actions) wraps the
            # push in an OCI image index even for single-platform builds, so
            # containerimage.digest from buildx metadata is the index digest, not the
            # per-platform manifest digest. Fetch the raw manifest from the registry and
            # select the linux/amd64 entry when the result is an index.
            RAW_MANIFEST=$(docker buildx imagetools inspect --raw "${IMAGE_REF}:${{ github.sha }}")
            if echo "${RAW_MANIFEST}" | jq -e 'has("manifests")' > /dev/null 2>&1; then
              DIGEST=$(echo "${RAW_MANIFEST}" | jq -r '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64")] | .[0].digest')
            else
              DIGEST=$(jq -r '."containerimage.digest"' flavor-image-metadata.json)
            fi
            echo "✓ Built and pushed ${IMAGE_REF}@${DIGEST}"
          else
            # AMI-only rebuild: reuse the container digest already recorded in flavors.lock;
            # no container rebuild. Fails loudly if the flavor has no recorded digest.
            if [ ! -f flavors.lock ]; then
              echo "::error::flavors.lock not found. Run a full image-level build for '${{ matrix.flavor }}' first."
              exit 1
            fi
            DIGEST=$(jq -r --arg f "${{ matrix.flavor }}" '.[$f].container_image_digest // empty' flavors.lock)
            if [ -z "$DIGEST" ]; then
              echo "::error::No entry for flavor '${{ matrix.flavor }}' in flavors.lock. Run a full image-level build first."
              exit 1
            fi
            echo "✓ Reusing existing digest for '${{ matrix.flavor }}': ${DIGEST}"
          fi

          echo "container_image=${IMAGE_REF}" >> $GITHUB_OUTPUT
          echo "container_image_digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Merge flavor env files (inject bucket-③ digest)
        run: |
          uv run python .github/scripts/merge_env.py \
            --flavor ${{ matrix.flavor }} \
            --container-image ${{ steps.digest.outputs.container_image }} \
            --container-image-digest ${{ steps.digest.outputs.container_image_digest }} \
            --output effective-${{ matrix.flavor }}.env

      - name: Build KIWI image
        run: |
          chmod +x .github/scripts/build-kiwi-image.sh
          SSH_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            SSH_FLAG="--enable-ssh"
          fi
          .github/scripts/build-kiwi-image.sh $SSH_FLAG --env-file effective-${{ matrix.flavor }}.env

      - name: Print effective configuration to summary
        run: |
          echo "### Effective Server Configuration (${{ matrix.flavor }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          uv run python .github/scripts/print_config.py \
            --env-file effective-${{ matrix.flavor }}.env \
            --flavor ${{ matrix.flavor }} \
            --relaxations-output relaxations-${{ matrix.flavor }}.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: SSH debug warning
        if: github.event_name == 'workflow_dispatch' && inputs.enable_ssh == true
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> ⚠️ **WARNING: This image was built with SSH debug access enabled.**" >> $GITHUB_STEP_SUMMARY
          echo "> This image is NOT intended for production use." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kiwi-build-output-${{ matrix.flavor }}
          path: |
            build-output/*.raw
            build-output/pcr_measurements.json
          retention-days: 30

      - name: Extract PCR measurements
        id: pcr
        run: |
          PCR4=$(jq -r '.Measurements.PCR4' build-output/pcr_measurements.json)
          PCR7=$(jq -r '.Measurements.PCR7' build-output/pcr_measurements.json)

          if [ -z "$PCR4" ] || [ "$PCR4" = "null" ]; then
            echo "::error::PCR4 measurement is missing or invalid"
            exit 1
          fi

          if [ -z "$PCR7" ] || [ "$PCR7" = "null" ]; then
            echo "::error::PCR7 measurement is missing or invalid"
            exit 1
          fi

          echo "pcr4=$PCR4" >> $GITHUB_OUTPUT
          echo "pcr7=$PCR7" >> $GITHUB_OUTPUT

          echo "### PCR Measurements (${{ matrix.flavor }})" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`$PCR4\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`$PCR7\`" >> $GITHUB_STEP_SUMMARY

      - name: Confirm sandbox config is baked-in and PCR4-bound
        run: |
          # Task 7.1: verify the effective env path baked by build-kiwi-image.sh matches
          # the systemd EnvironmentFile= directive so the config is attested-at-rest
          # (bound by the verity root → PCR4) and NOT loaded from EC2 user_data.
          BAKED_ENV_PATH="/etc/github-actions-remote-executor/env"
          SERVICE_FILE="kiwi-descriptions/root/etc/systemd/system/github-actions-remote-executor.service"

          if ! grep -qF "EnvironmentFile=${BAKED_ENV_PATH}" "${SERVICE_FILE}"; then
            echo "::error::Systemd unit does not load EnvironmentFile from the baked path ${BAKED_ENV_PATH} — config is not attested-at-rest"
            exit 1
          fi

          PCR4="${{ steps.pcr.outputs.pcr4 }}"
          {
            echo "### Config Attestation (${{ matrix.flavor }})"
            echo ""
            echo "| Property | Value |"
            echo "|---|---|"
            echo "| Baked env path | \`${BAKED_ENV_PATH}\` (inside dm-verity-sealed erofs root) |"
            echo "| Systemd EnvironmentFile | \`${BAKED_ENV_PATH}\` (reads baked file; no EC2 user_data override) |"
            echo "| PCR4 | \`${PCR4}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate artifact tag
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9._-]/-/g')
          TIMESTAMP=$(date -u +%Y%m%d-%H%M%S)
          TAG="${BRANCH_NAME}-${TIMESTAMP}-${GITHUB_SHA::8}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Artifact tag: $TAG"

      - name: Install ORAS
        run: |
          VERSION="1.3.0"
          # Expected SHA-256 checksum for oras_1.3.0_linux_amd64.tar.gz
          # Source: https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_checksums.txt
          EXPECTED_SHA256="6cdc692f929100feb08aa8de584d02f7bcc30ec7d88bc2adc2054d782db57c64"
          curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
          # Verify SHA-256 checksum before extracting (Requirements: 17.13, 17.14)
          echo "${EXPECTED_SHA256}  oras_${VERSION}_linux_amd64.tar.gz" | sha256sum -c || {
            echo "::error::ORAS archive checksum verification failed. Expected ${EXPECTED_SHA256}."
            exit 1
          }
          mkdir -p oras-install/
          tar -zxf oras_*.tar.gz -C oras-install/
          sudo mv oras-install/oras /usr/local/bin/
          rm -rf oras_*.tar.gz oras-install/
          oras version

      - name: Authenticate to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push artifact to GHCR
        id: push
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          ARTIFACT_REF="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}:${{ steps.tag.outputs.tag }}"

          RAW_IMAGE=$(find build-output -name "*.raw" -type f | head -n 1)
          if [ -z "$RAW_IMAGE" ]; then
            echo "::error::Raw disk image not found in build-output directory"
            exit 1
          fi

          # Determine debug annotation based on whether SSH was enabled
          DEBUG_VALUE="false"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            DEBUG_VALUE="true"
          fi

          echo "Pushing artifact to: $ARTIFACT_REF"

          if ! oras push "$ARTIFACT_REF" \
            --annotation "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "com.github.attestable-image.pcr4=${{ steps.pcr.outputs.pcr4 }}" \
            --annotation "com.github.attestable-image.pcr7=${{ steps.pcr.outputs.pcr7 }}" \
            --annotation "com.github.attestable-image.container-image-digest=${{ steps.digest.outputs.container_image_digest }}" \
            --annotation "com.github.attestable-image.flavor=${{ matrix.flavor }}" \
            --annotation "debug=${DEBUG_VALUE}" \
            "$RAW_IMAGE:application/octet-stream" \
            build-output/pcr_measurements.json:application/json; then
            echo "::error::Failed to push artifact to GHCR"
            exit 1
          fi

          # Get the digest
          DIGEST=$(oras manifest fetch "$ARTIFACT_REF" --descriptor | jq -r '.digest')
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          echo "artifact_ref=$ARTIFACT_REF" >> $GITHUB_OUTPUT

          # Output the full digest-pinned reference for downstream consumers
          # This immutable reference prevents TOCTOU attacks via tag movement
          SUBJECT_NAME="ghcr.io/${REPO_LOWER}/attestable-image/${{ matrix.flavor }}"
          ARTIFACT_REF_DIGEST="${SUBJECT_NAME}@${DIGEST}"
          echo "artifact_ref_digest=$ARTIFACT_REF_DIGEST" >> $GITHUB_OUTPUT
          echo "subject_name=$SUBJECT_NAME" >> $GITHUB_OUTPUT

          echo "### Artifact Published (${{ matrix.flavor }})" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`$ARTIFACT_REF\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`$ARTIFACT_REF_DIGEST\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`$DIGEST\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate build provenance attestation
        id: attest
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: ${{ steps.push.outputs.subject_name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Save build context for AMI job
        run: |
          RELAXATIONS=$(cat relaxations-${{ matrix.flavor }}.json 2>/dev/null || echo '{}')
          jq -n \
            --arg artifact_ref "${{ steps.push.outputs.artifact_ref_digest }}" \
            --arg container_image_digest "${{ steps.digest.outputs.container_image_digest }}" \
            --argjson relaxations "$RELAXATIONS" \
            '{"artifact_ref": $artifact_ref, "container_image_digest": $container_image_digest, "relaxations": $relaxations}' \
            > build-context.json

      - name: Upload build context for AMI job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-context-${{ matrix.flavor }}
          path: build-context.json
          retention-days: 1

      - name: Generate workflow summary
        run: |
          echo "## Build Complete (${{ matrix.flavor }}) ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (digest-pinned)**: \`${{ steps.push.outputs.artifact_ref_digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Reference (tag)**: \`${{ steps.push.outputs.artifact_ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: \`${{ steps.push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### PCR Measurements" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR4**: \`${{ steps.pcr.outputs.pcr4 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **PCR7**: \`${{ steps.pcr.outputs.pcr7 }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Attestation" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation ID**: \`${{ steps.attest.outputs.attestation-id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Attestation URL**: ${{ steps.attest.outputs.attestation-url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verification Instructions" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To verify the attestation:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "gh attestation verify oci://${{ steps.push.outputs.artifact_ref_digest }} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --owner ${{ github.repository_owner }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To pull the artifact:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "oras pull ${{ steps.push.outputs.artifact_ref_digest }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  build-ami:
    needs: [detect-changes, build-flavor-image]
    # Runs after the single producer job via ordinary `needs` resolution — no `always()`
    # and no upstream-result juggling. Only the genuine gates remain: is there an AMI to
    # build, and are we on a ref/event where AMIs are registered (main or workflow_dispatch).
    # develop-skip: AMIs are only registered on main or workflow_dispatch (task 5.2).
    if: |
      needs.detect-changes.outputs.has_ami_builds == 'true' &&
      (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    # Single job (no per-flavor matrix): one shared instance builds every flavor,
    # compiling the toolchain once (task 7.1). Explicit timeout well under GitHub's
    # 6 h default, paired with the instance self-destruct TTL (shutdown -h +150) so
    # `worst-case run << timeout-minutes < TTL` holds (D2, task 7.6).
    timeout-minutes: 120

    env:
      # ${github.run_id}-${github.run_attempt}: run-scoped identifier passed
      # IDENTICALLY to terraform apply and destroy (run-scoped naming + orphan tag,
      # D9), and to the script as the snapshot tag value (D13). run_attempt is part
      # of the value because re-runs reuse run_id.
      RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      # NOTE: $RUNNER_TEMP is a shell env var set by the runner (the `runner` context
      # is not available in job-level `env`), so SSH_KEY_PATH is composed in-shell
      # in the steps below rather than here.

    permissions:
      id-token: write
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.12.2"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2

      - name: Install Python dependencies
        run: uv sync --all-extras

      - name: Download all build contexts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: build-context-*
          path: contexts

      - name: Build flavors manifest
        env:
          AMI_MATRIX: ${{ needs.detect-changes.outputs.ami_matrix }}
        run: |
          # Combine the per-flavor build-context-<flavor> artifacts into a single
          # manifest the multi-flavor driver consumes.
          FLAVORS=$(echo "$AMI_MATRIX" | jq -r '.include[].flavor')
          MANIFEST='[]'
          for FLAVOR in $FLAVORS; do
            CTX="contexts/build-context-${FLAVOR}/build-context.json"
            if [ ! -f "$CTX" ]; then
              echo "::error::Missing build context for flavor '${FLAVOR}' (${CTX})"
              exit 1
            fi
            ENTRY=$(jq --arg flavor "$FLAVOR" '{
              flavor: $flavor,
              artifact_ref: .artifact_ref,
              container_image_digest: .container_image_digest,
              relaxations: (.relaxations // {})
            }' "$CTX")
            MANIFEST=$(echo "$MANIFEST" | jq --argjson e "$ENTRY" '. + [$e]')
          done
          echo "$MANIFEST" | jq '.' > flavors-manifest.json
          echo "flavors-manifest.json:"
          cat flavors-manifest.json

      - name: Provision shared build instance (terraform apply)
        id: provision
        run: |
          # The WORKFLOW owns the Terraform lifecycle (D1): apply here, always()
          # destroy below — both in this job on this runner, because the build-ami
          # state is gitignored and local (only this runner can destroy what it
          # applied). SSH is restricted to this runner's public IP.
          RUNNER_IP=$(curl -sf --retry 3 https://checkip.amazonaws.com)
          cd terraform/build-ami
          terraform init -input=false
          terraform apply -auto-approve \
            -var "region=${AWS_REGION}" \
            -var "instance_type=c5.4xlarge" \
            -var "allowed_ssh_cidr=${RUNNER_IP}/32" \
            -var "run_id=${RUN_ID}"
          # Export the instance host and write the SSH key to a 600 temp file.
          # $RUNNER_TEMP is absolute, so this is correct despite the cd above.
          echo "instance_host=$(terraform output -raw instance_public_ip)" >> "$GITHUB_OUTPUT"
          terraform output -raw ssh_private_key > "$RUNNER_TEMP/build-ami-key.pem"
          chmod 600 "$RUNNER_TEMP/build-ami-key.pem"

      - name: Build AMIs (all flavors on the shared instance)
        run: |
          ALLOW_DEBUG_FLAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            ALLOW_DEBUG_FLAG="--allow-debug"
          fi
          mkdir -p ami-results-flat
          uv run python scripts/build-ami.py \
            --host "${{ steps.provision.outputs.instance_host }}" \
            --ssh-key-path "$RUNNER_TEMP/build-ami-key.pem" \
            --run-id "${RUN_ID}" \
            --flavors-manifest flavors-manifest.json \
            --region "${AWS_REGION}" \
            --output-dir ami-results-flat \
            --expected-workflow .github/workflows/build-attestable-image.yml \
            --producing-commit "${{ github.sha }}" \
            $ALLOW_DEBUG_FLAG

      - name: Reshape per-flavor results into per-flavor artifact layout
        if: always()
        run: |
          # The script writes flat ami_build_result-<flavor>.json (task 4.7). Reshape
          # each into ami-results/ami-build-result-<flavor>/ami_build_result.json so
          # update-flavors-lock consumes it unchanged (per-flavor entry keyed by
          # flavor, file named ami_build_result.json). Only flavors that produced a
          # result appear — preserving per-flavor failure isolation (D8).
          shopt -s nullglob
          mkdir -p ami-results
          for f in ami-results-flat/ami_build_result-*.json; do
            base=$(basename "$f")                        # ami_build_result-<flavor>.json
            flavor=${base#ami_build_result-}             # <flavor>.json
            flavor=${flavor%.json}                       # <flavor>
            mkdir -p "ami-results/ami-build-result-${flavor}"
            cp "$f" "ami-results/ami-build-result-${flavor}/ami_build_result.json"
          done
          echo "Reshaped results:"; find ami-results -type f || true

      - name: Upload AMI build results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Single artifact whose internal layout is ami-build-result-<flavor>/
          # ami_build_result.json, so update-flavors-lock's per-flavor read path is
          # unchanged (task 7.7).
          name: ami-build-results
          path: ami-results/
          if-no-files-found: ignore
          retention-days: 90

      - name: Write AMI build summary
        if: always()
        run: |
          shopt -s nullglob
          RESULTS=(ami-results-flat/ami_build_result-*.json)
          if [ ${#RESULTS[@]} -eq 0 ]; then
            echo "## AMI Build — no per-flavor results produced ❌" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "No flavor produced an AMI. Check the job logs." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## AMI Build Results ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Flavor | AMI ID | Snapshot | PCR4 | Producing commit |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- | --- | --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          for f in "${RESULTS[@]}"; do
            base=$(basename "$f"); flavor=${base#ami_build_result-}; flavor=${flavor%.json}
            AMI_ID=$(jq -r '.ami_id' "$f")
            SNAPSHOT_ID=$(jq -r '.snapshot_id' "$f")
            PCR4=$(jq -r '.verifier_record.pcr4 // .pcr_measurements.pcr4' "$f")
            COMMIT=$(jq -r '.verifier_record.producing_commit // "unknown"' "$f")
            echo "| ${flavor} | \`${AMI_ID}\` | \`${SNAPSHOT_ID}\` | \`${PCR4}\` | \`${COMMIT}\` |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.enable_ssh }}" = "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ⚠️ **WARNING: These AMIs were built from debug artifacts (enable_ssh: true).**" >> "$GITHUB_STEP_SUMMARY"
            echo "> They are NOT intended for production use." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Cleanup shared build instance (terraform destroy)
        if: always()
        run: |
          # Single always() teardown (D1/D3). Because the script no longer runs a
          # finally-block destroy, this is the ONLY workflow-driven attempt, so it
          # must be robust: retry with backoff (destroy is idempotent/convergent — a
          # re-run only removes what remains) and FAIL LOUD if it cannot converge,
          # rather than green-washing a possible orphan. The instance self-destruct
          # (D2) is the safety net beneath even a fully-failed destroy. run_id is
          # passed IDENTICALLY to the apply above (D9).
          cd terraform/build-ami
          terraform init -input=false
          for attempt in 1 2 3 4 5; do
            if terraform destroy -auto-approve \
                -var "region=${AWS_REGION}" \
                -var "instance_type=c5.4xlarge" \
                -var "allowed_ssh_cidr=0.0.0.0/0" \
                -var "run_id=${RUN_ID}"; then
              echo "Terraform destroy succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::Terraform destroy attempt ${attempt} failed; retrying with backoff..."
            sleep $((attempt * 30))
          done
          echo "::error::Terraform destroy did not converge after retries. A build-ami orphan may remain (tag run_id=${RUN_ID}); the instance self-destruct TTL is the backstop. Manual cleanup may be required."
          exit 1

  update-flavors-lock:
    needs: [detect-changes, build-ami]
    # Skip debug builds (enable_ssh=true) — those AMIs must not enter flavors.lock (task 6.4).
    # Cascading skip from build-ami handles develop-skip and empty-matrix cases automatically.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.enable_ssh != true)
    runs-on: ubuntu-24.04
    # Serialize flavors.lock write-backs: only one update runs at a time per ref;
    # queued runs proceed in order rather than being cancelled (task 6.3).
    concurrency:
      group: flavors-lock-update-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}

      - name: Download all AMI build results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          # build-ami now emits one artifact whose internal layout is
          # ami-build-result-<flavor>/ami_build_result.json (the single-instance job
          # cannot dynamically emit N separate artifacts). The per-flavor read/merge
          # logic below is unchanged — it still reads
          # ami-results/ami-build-result-<flavor>/ami_build_result.json and carries
          # forward any flavor missing a result (failure isolation, task 7.7).
          name: ami-build-results
          path: ami-results/

      - name: Update flavors.lock
        env:
          AMI_MATRIX: ${{ needs.detect-changes.outputs.ami_matrix }}
        run: |
          # Start from the existing lock (carry forward unchanged entries) or an empty object.
          LOCK='{}'
          if [ -f flavors.lock ]; then
            LOCK=$(cat flavors.lock)
          fi

          # For each flavor rebuilt in this run, merge in the new verifier record.
          # ami-results/ami-build-result-<flavor>/ami_build_result.json is the per-flavor output.
          FLAVORS=$(echo "$AMI_MATRIX" | jq -r '.include[].flavor')
          for FLAVOR in $FLAVORS; do
            RESULT_FILE="ami-results/ami-build-result-${FLAVOR}/ami_build_result.json"
            if [ -f "$RESULT_FILE" ]; then
              ENTRY=$(jq '{
                container_image_digest: .verifier_record.container_image_digest,
                pcr4: .verifier_record.pcr4,
                ami_id: .verifier_record.ami_id,
                producing_commit: .verifier_record.producing_commit,
                relaxations: (.verifier_record.relaxations // {})
              }' "$RESULT_FILE")
              LOCK=$(echo "$LOCK" | jq --arg f "$FLAVOR" --argjson e "$ENTRY" '.[$f] = $e')
            else
              echo "::warning::No build result for flavor '${FLAVOR}' — entry not updated"
            fi
          done

          # Write sorted, pretty-printed JSON for stable diffs.
          printf '%s\n' "$LOCK" | jq --sort-keys '.' > flavors.lock
          echo "flavors.lock after update:"
          cat flavors.lock

      - name: Commit and push flavors.lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain flavors.lock)" ]; then
            echo "No changes to flavors.lock — skipping commit"
            exit 0
          fi

          git add flavors.lock
          git commit -m "chore: update flavors.lock after AMI build [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Write flavors.lock summary
        run: |
          echo "## flavors.lock Updated" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
          cat flavors.lock >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
