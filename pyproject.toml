[project]
name = "github-actions-remote-executor"
version = "0.1.0"
description = "Secure HTTP server for executing scripts from GitHub repositories with attestation"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115.0", "uvicorn>=0.32.0", "requests>=2.32.0"]

[project.optional-dependencies]
dev = [
    "hypothesis>=6.100.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.3",
    "boto3>=1.42.77",
    "paramiko>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
